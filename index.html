<!DOCTYPE html>
<html>
<head>
    <title>Dice Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🎲 Dice Game</h1>

        <div class="players">
            <div>
                <h2>👤 You</h2>
                <div id="yourDice">⚀</div>
                <p>Score: <span id="yourScore">0</span></p>
            </div>

            <div>
                <h2>🤖 Me</h2>
                <div id="myDice">⚀</div>
                <p>Score: <span id="myScore">0</span></p>
            </div>
        </div>

        <h2 id="message">Roll the dice!</h2>

        <button id="rollButton">🎲 ROLL</button>
        <button id="resetButton">🔄 RESET</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
